# 週次運用 (docs/05_OPERATIONS.md)
#
# Worker とは別プロセスで動かす。Source crawling と Public serving を分離するため
# （docs/08_ARCHITECTURE.md §3 rule 4）。D1 へは REST API 経由で接続する。
#
# 必要な secrets:
#   CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_D1_DATABASE_ID / CLOUDFLARE_API_TOKEN
#   CRAWLER_CONTACT（任意。User-Agent に載せる連絡先）
name: ops

on:
  schedule:
    # cron は UTC。JST = UTC+9
    - cron: "0 20 * * 0,1,2" # 月・火・水 05:00 JST — Source 巡回
    - cron: "30 19 * * *"    # 毎日 04:30 JST — 期限切れの掃除
    - cron: "0 21 * * 3"     # 木 06:00 JST — 抽出
    - cron: "0 21 * * 4"     # 金 06:00 JST — 週末の紹介候補
  workflow_dispatch:
    inputs:
      command:
        description: "手動実行するコマンド"
        required: true
        default: "ops:metrics"
        type: choice
        options: ["ops:check", "ops:extract", "ops:lifecycle", "ops:weekend", "ops:metrics", "ops:seed"]

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CRAWLER_CONTACT: ${{ secrets.CRAWLER_CONTACT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 手動実行
        if: github.event_name == 'workflow_dispatch'
        run: npm run ${{ inputs.command }}

      - name: Source 巡回（月・火・水）
        if: github.event.schedule == '0 20 * * 0,1,2'
        run: npm run ops:check

      - name: 期限切れの掃除（毎日）
        if: github.event.schedule == '30 19 * * *'
        run: npm run ops:lifecycle

      # GitHub Actions は実行間で .cache を共有しないので、
      # 直近に変更された Source を --since で拾って取り直す
      - name: 抽出（木）
        if: github.event.schedule == '0 21 * * 3'
        run: npm run ops:extract -- --since=$(date -u -d '8 days ago' +%Y-%m-%d) --refetch

      - name: 週末の紹介候補（金）
        if: github.event.schedule == '0 21 * * 4'
        run: npm run ops:weekend

      - name: 出力を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-output
          path: .cache/*.md
          if-no-files-found: ignore
